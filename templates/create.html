{% extends "layout.html" %}

{% block title %}
    Create Team
{% endblock %}

{% block main %}
<div>
    <br></br>
    <h1>Create a Team</h1>
</div>
<br>
<br>
<div>
    <form action="/create" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="team name" placeholder="Team name" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="join code" placeholder="Join Code" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="confirm" placeholder="Join Code" type="text">
        </div>
        <button class="btn btn-primary" type="submit" name="submit">Create</button>
    </form>
    <div>
        <br>
        <p style="color: brown;"> {{ message }}</p>
    </div>
</div>
{% endblock %}
