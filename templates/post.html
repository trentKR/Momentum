{% extends "layout.html" %}

{% block title %}
    Post
{% endblock %}

{% block main %}

<div class="container mt-5">
    <h1>Post a Workout</h1>
    <br></br>

    <!-- For laptops -->
    <div class="d-none d-md-block">
        <div class="row justify-content-center">
            <div class="col-10">
                <div class="card p-4 mb-3">
                    <form action="/post" method="post" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-9 mb-3">
                                <input class="form-control" id="title" name="title" placeholder="Title" type="text">
                            </div>
                            <div class="col-3 mb-3">
                                <input class="form-control" id="date" name="date" type="date">
                            </div>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="description" name="description" placeholder="Description" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" id="image" name="image" type="file">
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- For phones -->
    <div class="d-block d-md-none">
        <div class="row justify-content-center">
            <div class="col-10">
                <div class="card p-4 mb-3">
                    <form action="/post" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input class="form-control" id="date" name="date" type="date">
                        </div>
                        <div class=" mb-3">
                            <input class="form-control" id="title" name="title" placeholder="Title" type="text">
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="description" name="description" placeholder="Description" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" id="image" name="image" type="file">
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div>
        <p style="color: red">{{ message }}</p>
    </div>

</div>
{% endblock %}
