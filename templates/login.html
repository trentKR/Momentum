{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div>
    <div>
        <br></br>
        <h1>Welcome to Momentum</h1>
        <a href="/register" class="small"> New member? Click here to register.</a>
    </div>
    <br>
    <br>
    <form action="/login" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Log In</button>
    </form>
    <br>
    
    <div>
        <br>
        <p style="color: brown;"> {{ message }}</p>
    </div>
</div>
{% endblock %}
